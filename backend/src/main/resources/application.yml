app:
  name: PathPilot
  tagline: Track . Learn . Grow
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    cookie-name: ${JWT_COOKIE_NAME:pathpilot_token}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  rate-limit:
    auth-max-attempts: ${AUTH_RATE_LIMIT_MAX:5}
    auth-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS:10000}
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    max-file-size-bytes: ${UPLOADS_MAX_BYTES:2097152}

spring:
  application:
    name: ${app.name}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: 8080

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
