app:
  jwt:
    # Local development fallback only; override via JWT_SECRET env var in production
    secret: ${JWT_SECRET:pathpilot-local-dev-secret-change-in-env-at-least-32-bytes}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  github:
    # Local development fallback only; override via GITHUB_TOKEN_ENCRYPTION_KEY env var in production
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:pathpilot-local-token-enc-key-32b}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pathpilot}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.pathpilot: INFO
    org.flywaydb: INFO
